<main class="login">
  <section class="login__panel">
    <img class="login__logo" src="brand/logo-lp.png" alt="Lex Capital" />
    <p class="login__brand">LEX CAPITAL LEGAL GROUP</p>
    <h1>Acceso al CRM</h1>
    <p class="login__hint">Recuperación de activos y reclamaciones financieras</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>
        Email
        <input type="email" formControlName="email" autocomplete="username" />
      </label>
      <label>
        Contraseña
        <input
          type="password"
          formControlName="password"
          autocomplete="current-password"
        />
      </label>

      @if (error()) {
        <p class="login__error">{{ error() }}</p>
      }

      <button type="submit" [disabled]="loading()">
        {{ loading() ? 'Entrando…' : 'Ingresar' }}
      </button>
    </form>

    <p class="login__demo">
      <a routerLink="/consultores">← Portal de consultores</a>
    </p>
  </section>
</main>
